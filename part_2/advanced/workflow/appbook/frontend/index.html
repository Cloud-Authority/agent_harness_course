<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip workflow / Appbook</title>
  <meta name="description" content="A durable, branching workflow harness that books a trip: real search, typed answers, approval, a booking saga, crash recovery." />
  <link rel="icon" href="data:," />
  <script>(function(){try{var t=localStorage.getItem("adv-theme")||(window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/course.css?v=1" />
  <link rel="stylesheet" href="/shared/refarch.css?v=2" />
  <link rel="stylesheet" href="/local.css?v=1" />
</head>
<body>
  <button class="menu" id="menu" aria-label="Open chapters">&#9776;</button>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">TW</div><div class="brand-copy"><strong>Trip workflow</strong><span>Part 2 advanced · workflow mode</span></div></div>
      <nav id="chapters" aria-label="Chapters"></nav>
      <div class="sidebar-foot"><div class="status-chip" id="global-status"><i class="status-dot"></i><span>Warming harness</span></div></div>
    </aside>
    <div class="main">
      <header class="topbar" id="topbar" aria-label="Harness status"></header>
      <main class="stage" id="stage" tabindex="-1"></main>
    </div>
  </div>
  <button class="scrim" id="scrim" aria-label="Close menu" hidden></button>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <section class="data-explorer" id="data-explorer" aria-label="Data explorer">
    <button class="explorer-handle" id="explorer-toggle" aria-expanded="false" aria-controls="explorer-body">
      <span class="explorer-title"><i class="db-glyph">DB</i><strong>Data explorer</strong><span id="explorer-summary">The harness tables in Oracle AI Database, read-only</span></span>
      <span class="explorer-chevron" aria-hidden="true">&#8963;</span>
    </button>
    <div class="explorer-body" id="explorer-body" hidden>
      <aside class="explorer-tables" aria-label="Tables">
        <div class="explorer-section-head"><span>Tables</span><button id="explorer-refresh" title="Re-read" aria-label="Re-read the table list">&#8635;</button></div>
        <div class="table-list" id="explorer-table-list"></div>
      </aside>
      <section class="explorer-data" aria-label="Rows">
        <div class="explorer-toolbar" id="explorer-toolbar"></div>
        <div class="data-grid-wrap" id="explorer-grid"><div class="empty">Choose a table to read its newest rows.</div></div>
      </section>
    </div>
  </section>
  <script src="/shared/app.js?v=1"></script>
  <script src="/shared/refarch.js?v=2"></script>
  <script src="/refarch-spec.js?v=2"></script>
  <script src="/chapters.js?v=1"></script>
  <script>APP.boot();</script>
</body>
</html>
